name: Forbidden Files

# Impedisce che finiscano nel repository segreti/artefatti: token o config reali,
# .env, CSV generati (eccetto il dizionario ufficiale), log, EXE, ZIP.
# Vedi le regole in CLAUDE.md / .gitignore.
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forbidden-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - name: Controllo file vietati tracciati
        # PR-D del piano #194: le `grep -E` che stavano qui erano una COPIA dei pattern dello
        # scanner, e le copie divergono. Misurato prima della correzione: questo file cercava un
        # bot-id Telegram `[0-9]{8,10}` mentre `tools/secret_scan.py` cercava `[0-9]{8,12}` — il
        # gate CI non intercettava i bot-id lunghi che l'hook pre-commit intercettava. Ora le
        # regole vivono in `tools/secret_policy.py` e questo step le invoca soltanto.
        #
        # Il controllo dei CONTENUTI (token, chiavi, seed) non è duplicato qui: lo fa lo step
        # successivo, che è l'unica fonte dei pattern di contenuto.
        run: python tools/forbidden_paths.py
      - name: Secret scan esteso (token/chiavi/AWS)
        # Difesa-in-profondità (#153 H3): scanner condiviso con l'hook pre-commit, fonte
        # unica dei pattern. Estende lo scan del token Telegram con chiavi private PEM e
        # AWS key id. Stampa SOLO i path (mai il valore). Cross-platform (Python, no bash).
        run: python tools/secret_scan.py
